on:
    push:
        branches: ['**']
#        branches: ['master']
        tags-ignore: ['**']  # Ignore all tag pushes
    pull_request:

jobs:
 deploy:
    runs-on: ubuntu-latest
    if: (github.event_name!='pull_request')
    steps: 
    - uses: softprops/action-gh-release@v2
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        draft: true
        tag_name: autotagname-${{ github.sha }}
      if: github.event_name != 'pull_request'

 unixmatrix:
    runs-on: ${{ matrix.cfg.os }}
    defaults:
        run:
            shell: ${{ matrix.cfg.shell }}
    strategy:
        fail-fast: false
        matrix:
            cfg:
            - { os: windows-11-arm  , shell: cmd , arch: arm64  , bitness: 64, runtime: vc18          , cmake_params: '-G "Visual Studio 18" -T v145 -A arm64', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows Visual Studio 2026 arm64' }
            - { os: windows-2025    , shell: cmd , arch: x64    , bitness: 64, runtime: vc18          , cmake_params: '-G "Visual Studio 18" -T v145 -A x64'  , cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows Visual Studio 2026 x64' }
            - { os: windows-2025    , shell: cmd , arch: x86    , bitness: 32, runtime: vc18          , cmake_params: '-G "Visual Studio 18" -T v145 -A Win32', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows Visual Studio 2026 x86' }
            - { os: windows-11-arm  , shell: cmd , arch: arm64  , bitness: 64, runtime: vc17          , cmake_params: '-G "Visual Studio 17" -T v143 -A arm64', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows Visual Studio 2022 arm64' }
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: vc17          , cmake_params: '-G "Visual Studio 17" -T v143 -A x64'  , cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows Visual Studio 2022 x64' }
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: vc17          , cmake_params: '-G "Visual Studio 17" -T v143 -A Win32', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows Visual Studio 2022 x86' }
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: vc16          , cmake_params: '-G "Visual Studio 17" -T v142 -A x64'  , cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows Visual Studio 2019 x64' }
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: vc16          , cmake_params: '-G "Visual Studio 17" -T v142 -A Win32', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows Visual Studio 2019 x86' }
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: vc15          , cmake_params: '-G "Visual Studio 17" -T v141 -A x64'  , cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows Visual Studio 2017 x64' }
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: vc15          , cmake_params: '-G "Visual Studio 17" -T v141 -A Win32', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows Visual Studio 2017 x86' }
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: vc14          , cmake_params: '-G "Visual Studio 17" -T v140 -A x64,version=10.0.19041.0 -D CMAKE_SYSTEM_VERSION=10.0.14393.0'  , cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows Visual Studio 2015 x64' }
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: vc14          , cmake_params: '-G "Visual Studio 17" -T v140 -A Win32,version=10.0.19041.0 -D CMAKE_SYSTEM_VERSION=10.0.14393.0', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', test_config: 'Release/', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows Visual Studio 2015 x86' }
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: mingw15       , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows MinGW 15.2.0 x64' }
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: mingw15       , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows MinGW 15.2.0 x86' }         
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: mingw14       , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows MinGW 14.2.0 x64' }                              
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: mingw14       , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows MinGW 14.2.0 x86' }         
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: mingw13       , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows MinGW 13.2.0 x64' }                              
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: mingw13       , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows MinGW 13.2.0 x86' }         
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: mingw12       , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows MinGW 12.2.0 x64' }                              
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: mingw12       , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows MinGW 12.2.0 x86' }         
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: mingw11       , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows MinGW 11.2.0 x64' }                              
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: mingw11       , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows MinGW 11.2.0 x86' }         
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: mingw8        , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows MinGW 8.1.0 x64' }                               
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: mingw8        , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows MinGW 8.1.0 x86' }          
            - { os: windows-2022    , shell: cmd , arch: x64    , bitness: 64, runtime: mingw7        , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', desc: 'Windows MinGW 7.3.0 x64' }                               
            - { os: windows-2022    , shell: cmd , arch: x86    , bitness: 32, runtime: mingw7        , cmake_params: '-G "MinGW Makefiles"', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', choco_flags: '--x86', desc: 'Windows MinGW 7.3.0 x86' }
            - { os: ubuntu-24.04    , shell: bash, arch: amd64  , bitness: 64, runtime: noble         , cmake_flags: '-fPIC', ilib: 'gaol', deb: true, desc: 'Ubuntu 24.04 amd64' }
            - { os: ubuntu-24.04-arm, shell: bash, arch: arm64  , bitness: 64, runtime: noble         , cmake_flags: '-fPIC', ilib: 'gaol', deb: true, desc: 'Ubuntu 24.04 arm64' }
            - { os: ubuntu-22.04    , shell: bash, arch: amd64  , bitness: 64, runtime: jammy         , cmake_flags: '-fPIC', ilib: 'gaol', deb: true, desc: 'Ubuntu 22.04 amd64' }
            - { os: ubuntu-22.04-arm, shell: bash, arch: arm64  , bitness: 64, runtime: jammy         , cmake_flags: '-fPIC', ilib: 'gaol', deb: true, desc: 'Ubuntu 22.04 arm64' }
            - { os: macos-26        , shell: bash, arch: arm64  , bitness: 64, runtime: tahoe         , cmake_params: '-D CMAKE_SYSTEM_NAME=Darwin -D CMAKE_OSX_ARCHITECTURES=arm64' , cmake_flags: '-fPIC', ilib: 'gaol', desc: 'macOS Tahoe arm64' }
            - { os: macos-26        , shell: bash, arch: x86_64 , bitness: 64, runtime: tahoe         , cmake_params: '-D CMAKE_SYSTEM_NAME=Darwin -D CMAKE_OSX_ARCHITECTURES=x86_64 -D CMAKE_OSX_DEPLOYMENT_TARGET=26.0 -D HAVE_GETRUSAGE_IN_HEADER_EXITCODE=0 -D HAVE_GETRUSAGE_IN_HEADER__TRYRUN_OUTPUT=""', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', cross: true, desc: 'macOS Tahoe x86_64 (cross)' }
            - { os: macos-15        , shell: bash, arch: arm64  , bitness: 64, runtime: sequoia       , cmake_params: '-D CMAKE_SYSTEM_NAME=Darwin -D CMAKE_OSX_ARCHITECTURES=arm64' , cmake_flags: '-fPIC', ilib: 'gaol', desc: 'macOS Sequoia arm64' }
            - { os: macos-15-intel  , shell: bash, arch: x86_64 , bitness: 64, runtime: sequoia       , cmake_params: '-D CMAKE_SYSTEM_NAME=Darwin -D CMAKE_OSX_ARCHITECTURES=x86_64', cmake_flags: '-fPIC', ilib: 'gaol', desc: 'macOS Sequoia x86_64' }
            - { os: macos-14        , shell: bash, arch: arm64  , bitness: 64, runtime: sonoma        , cmake_params: '-D CMAKE_SYSTEM_NAME=Darwin -D CMAKE_OSX_ARCHITECTURES=arm64' , cmake_flags: '-fPIC', ilib: 'gaol', desc: 'macOS Sonoma arm64' }
            - { os: macos-14        , shell: bash, arch: x86_64 , bitness: 64, runtime: sonoma        , cmake_params: '-D CMAKE_SYSTEM_NAME=Darwin -D CMAKE_OSX_ARCHITECTURES=x86_64 -D CMAKE_OSX_DEPLOYMENT_TARGET=14.0 -D HAVE_GETRUSAGE_IN_HEADER_EXITCODE=0 -D HAVE_GETRUSAGE_IN_HEADER__TRYRUN_OUTPUT=""', cmake_flags: '-fPIC', ilib: 'gaol', cmake_gaol: ' -D MATHLIB_DIR=../mathlib -D GAOL_DIR=../gaol', cross: true, desc: 'macOS Sonoma x86_64 (cross)' }
    name: ${{ matrix.cfg.desc }}
    steps: 
    - uses: actions/checkout@v5
      with:
        submodules: true
        fetch-depth: 0
        clean: false
      # From https://github.com/Munkei/VersionFromGit.cmake/blob/master/VersionFromGit.cmake
    - run: echo "git_tag=`git describe --tags --abbrev=0`" >> $GITHUB_ENV
      shell: bash
      # See https://askubuntu.com/questions/620533/what-is-the-meaning-of-the-xubuntuy-string-in-ubuntu-package-names
    - run: |
        #echo "SOFTWARE_VERSION=${git_tag:5}" >> $GITHUB_ENV
        echo "SOFTWARE_VERSION=2.8.9.20250626" >> $GITHUB_ENV
        echo "DEBIAN_PACKAGE_REV=0" >> $GITHUB_ENV
        echo "PACKAGE_REV=0" >> $GITHUB_ENV
        echo "CHOCO_PACKAGE_REV=" >> $GITHUB_ENV
        echo "VERBOSE=1" >> $GITHUB_ENV
      shell: bash
    - run: if [ -z "$CHOCO_PACKAGE_REV" ]; then echo "PACKAGE_VERSION=$SOFTWARE_VERSION" >> $GITHUB_ENV ; else echo "PACKAGE_VERSION=$SOFTWARE_VERSION.$CHOCO_PACKAGE_REV" >> $GITHUB_ENV ; fi
      shell: bash
      if: runner.os=='Windows'
    - run: echo "PACKAGE_VERSION=$SOFTWARE_VERSION-${DEBIAN_PACKAGE_REV}${{ matrix.cfg.runtime }}$PACKAGE_REV" >> $GITHUB_ENV
      shell: bash
      if: matrix.cfg.deb==true
    - run: |
        choco install -y -r --no-progress checksum wget zip make
        rem Workaround to try solve some random package download failures...
        wget https://www.ensta-bretagne.fr/packages/choco/winflexbison.2.4.9.20170215.nupkg --no-check-certificate -nv
        wget https://www.ensta-bretagne.fr/packages/choco/patch.2.5.9.nupkg --no-check-certificate -nv
        choco install -y -r --no-progress -s . winflexbison patch ${{ matrix.cfg.choco_flags }}
        del /f /q winflexbison.2.4.9.20170215.nupkg patch.2.5.9.nupkg
        wget http://www.ensta-bretagne.fr/lebars/Share/cmake_extra_tools.zip --no-check-certificate -nv
        7z x cmake_extra_tools.zip -o"%SystemDrive%" -y
        del /f /q cmake_extra_tools.zip
        wget https://gist.github.com/lebarsfa/237841f9e5dad55ef192713b3b1b2f16/raw/04d77ced3457346c55f183ca12a10dbcb850e6d5/refreshenv.bashrc --no-check-certificate -nv
        move /y refreshenv.bashrc %USERPROFILE%
      if: runner.os=='Windows'
    - run: |
        choco install -y -r --no-progress mingw --version=7.3.0 --force ${{ matrix.cfg.choco_flags }}
        %SystemDrive%\cmake_extra_tools\pathman /as C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw${{ matrix.cfg.bitness }}\bin & cd. & rem Non-zero exit code...?
        echo export BASHMINGWPATH=/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw${{ matrix.cfg.bitness }}/bin>>%USERPROFILE%\.bashrc
      if: (matrix.cfg.runtime=='mingw7')
    - run: |
        choco install -y -r --no-progress mingw --version=8.1.0 --force ${{ matrix.cfg.choco_flags }}
        %SystemDrive%\cmake_extra_tools\pathman /as C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw${{ matrix.cfg.bitness }}\bin & cd. & rem Non-zero exit code...?
        echo export BASHMINGWPATH=/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw${{ matrix.cfg.bitness }}/bin>>%USERPROFILE%\.bashrc
      if: (matrix.cfg.runtime=='mingw8')
    - run: |
        choco install -y -r --no-progress mingw --version=11.2.0.07112021 --force ${{ matrix.cfg.choco_flags }}
        %SystemDrive%\cmake_extra_tools\pathman /as C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw${{ matrix.cfg.bitness }}\bin & cd. & rem Non-zero exit code...?
        echo export BASHMINGWPATH=/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw${{ matrix.cfg.bitness }}/bin>>%USERPROFILE%\.bashrc
      if: (matrix.cfg.runtime=='mingw11')
    - run: |
        choco install -y -r --no-progress mingw --version=12.2.0.03042023 --force ${{ matrix.cfg.choco_flags }}
        %SystemDrive%\cmake_extra_tools\pathman /as C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw${{ matrix.cfg.bitness }}\bin & cd. & rem Non-zero exit code...?
        echo export BASHMINGWPATH=/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw${{ matrix.cfg.bitness }}/bin>>%USERPROFILE%\.bashrc
      if: (matrix.cfg.runtime=='mingw12')
    - run: |
        choco install -y -r --no-progress mingw --version=13.2.0 --force ${{ matrix.cfg.choco_flags }}
        %SystemDrive%\cmake_extra_tools\pathman /as C:\ProgramData\mingw64\mingw${{ matrix.cfg.bitness }}\bin & cd. & rem Non-zero exit code...?
        echo export BASHMINGWPATH=/c/ProgramData/mingw64/mingw${{ matrix.cfg.bitness }}/bin>>%USERPROFILE%\.bashrc
      if: (matrix.cfg.runtime=='mingw13')
    - run: |
        choco install -y -r --no-progress mingw --version=14.2.0 --force ${{ matrix.cfg.choco_flags }}
        %SystemDrive%\cmake_extra_tools\pathman /as C:\ProgramData\mingw64\mingw${{ matrix.cfg.bitness }}\bin & cd. & rem Non-zero exit code...?
        echo export BASHMINGWPATH=/c/ProgramData/mingw64/mingw${{ matrix.cfg.bitness }}/bin>>%USERPROFILE%\.bashrc
      if: (matrix.cfg.runtime=='mingw14')
    - run: |
        choco install -y -r --no-progress mingw --version=15.2.0 --force ${{ matrix.cfg.choco_flags }}
        %SystemDrive%\cmake_extra_tools\pathman /as C:\ProgramData\mingw64\mingw${{ matrix.cfg.bitness }}\bin & cd. & rem Non-zero exit code...?
        echo export BASHMINGWPATH=/c/ProgramData/mingw64/mingw${{ matrix.cfg.bitness }}/bin>>%USERPROFILE%\.bashrc
      if: (matrix.cfg.runtime=='mingw15')
    - run: |
        rem Warning: Windows SDK 10.0.18362.0 might not install correctly even if the rest looks OK, and there might be incompatibilities between Visual Studio 2015 compiler and more recent SDKs...
        "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.140 --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --force --quiet --norestart --addProductLang en-US --includeRecommended
      if: (matrix.cfg.runtime=='vc14')
    - run: |
        "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.VC.v141.ARM64 --force --quiet --norestart --addProductLang en-US --includeRecommended
      if: (matrix.cfg.runtime=='vc15')
    # If needed in the future...
    #- run: |
    #    "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64 --add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64 --add Microsoft.VisualStudio.Component.VC.14.29.16.11.ARM64 --force --quiet --norestart --addProductLang en-US --includeRecommended
    #  if: (matrix.cfg.runtime=='vc16')
    - run: |
        choco feature disable -n usePackageExitCodes
        choco install -y -r --no-progress visualstudio2026buildtools --package-parameters "--addProductLang en-US --includeRecommended --add Microsoft.VisualStudio.Component.CoreEditor --add Microsoft.VisualStudio.Workload.NativeDesktop --add Microsoft.VisualStudio.Workload.ManagedDesktop --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Workload.ManagedDesktopBuildTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --add Microsoft.VisualStudio.Workload.NativeCrossPlat --add Microsoft.VisualStudio.Component.VC.ATLMFC --add Microsoft.VisualStudio.Component.VC.CLI.Support --remove Component.Microsoft.VisualStudio.LiveShare --remove Microsoft.VisualStudio.Component.VC.TestAdapterForGoogleTest --remove Microsoft.VisualStudio.Component.VC.TestAdapterForBoostTest --remove Microsoft.VisualStudio.Component.EntityFramework --remove Microsoft.Component.CookiecutterTools --remove Microsoft.Component.PythonTools.Web --remove Component.CPython3.x64 --remove Microsoft.Component.PythonTools.Minicondax64"
      if: (matrix.cfg.runtime=='vc18')
    - run: |
        rem Temporary issue on windows-11-arm, existing system CMake cannot be updated due to some MSI error, so using the one from Visual Studio...?
        echo export BASHCMAKEPATH="/c/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin">>%USERPROFILE%\.bashrc
      if: (matrix.cfg.runtime=='vc18')&&(matrix.cfg.os=='windows-11-arm')
    - run: |
        choco install -y -r --no-progress cmake --force
        echo export BASHCMAKEPATH="/c/Program Files/CMake/bin">>%USERPROFILE%\.bashrc
      if: (matrix.cfg.runtime=='vc18')&&(matrix.cfg.os!='windows-11-arm')
    - run: sudo apt-get -q update ; sudo apt-get -y install flex bison dpkg-dev || true
      if: matrix.cfg.deb==true
    - run: |  
        # Temporary build of mathlib using cmake...
        if [ ${{ runner.os }} = Windows ]; then source ~/refreshenv.bashrc ; refreshenv ; export PATH=$BASHMINGWPATH:$BASHCMAKEPATH:$PATH ; fi
        mkdir mathlib-tmp ; cd mathlib-tmp ; git clone --depth 1 -b master https://github.com/lebarsfa/mathlib.git ; cd mathlib
        mkdir build ; cd build
        cmake -E env CXXFLAGS="${{ matrix.cfg.cmake_flags }}" CFLAGS="${{ matrix.cfg.cmake_flags }}" cmake ${{ matrix.cfg.cmake_params }} -D CMAKE_INSTALL_PREFIX=../../../mathlib ..
        cmake --build . -j 4 --config Release --target install
        cd ../../..
        rm -Rf mathlib-tmp
      shell: bash
      if: matrix.cfg.cmake_gaol!=''
    - run: |    
        # Temporary build of gaol using cmake...
        if [ ${{ runner.os }} = Windows ]; then source ~/refreshenv.bashrc ; refreshenv ; export PATH=$BASHMINGWPATH:$BASHCMAKEPATH:$PATH ; fi
        mkdir gaol-tmp ; cd gaol-tmp ; git clone --depth 1 -b master https://github.com/lebarsfa/gaol.git ; cd gaol
        mkdir build ; cd build
